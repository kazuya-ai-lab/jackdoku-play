<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Jackdoku</title>
    <style>
      :root {
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    sans-serif;
  color: #28251f;
  background: #f7f4ed;
  font-synthesis: none;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background-color: #f7f4ed;
  background-image: radial-gradient(circle at top, rgba(255, 255, 255, 0.95), transparent 36rem);
}

button,
input {
  font: inherit;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid #315d79;
  outline-offset: 2px;
}

#app {
  min-height: 100vh;
}

.game-shell {
  width: min(100%, 74rem);
  margin: 0 auto;
  padding: clamp(1rem, 2.5vw, 2rem);
}

.game-header {
  text-align: center;
}

.header-row {
  display: grid;
  grid-template-columns: 7rem 1fr 7rem;
  align-items: center;
  gap: 0.75rem;
}

.header-button {
  justify-self: start;
  padding: 0.55rem 0.8rem;
  border: 1px solid #cbbfae;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.76);
  color: #59452f;
  cursor: pointer;
}

.header-button-right {
  justify-self: end;
}

h1 {
  margin: 0;
  font-size: clamp(2rem, 5vw, 3.2rem);
  line-height: 1;
  letter-spacing: -0.04em;
}

.game-subtitle {
  margin: 0.7rem 0 0;
  color: #625d52;
  font-size: 0.95rem;
}

.status-bar {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.5rem;
  width: min(100%, 38rem);
  margin: 1.25rem auto;
}

.status-item {
  min-width: 0;
  padding: 0.65rem 0.5rem;
  border: 1px solid #ded7c8;
  border-radius: 0.8rem;
  background: rgba(255, 255, 255, 0.72);
  text-align: center;
}

.status-label,
.status-value {
  display: block;
}

.status-label {
  color: #756e61;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.status-value {
  margin-top: 0.15rem;
  font-size: 1rem;
}

.tutorial-panel {
  width: min(100%, 60rem);
  margin: 0 auto 1rem;
  padding: 0.8rem 1rem;
  border: 1px solid #d8c69c;
  border-radius: 0.9rem;
  background: #fff7dc;
}

.tutorial-panel[hidden] {
  display: none;
}

.tutorial-title {
  display: block;
  color: #664a1f;
}

.tutorial-text {
  margin: 0.25rem 0 0;
  color: #6e5a37;
  font-size: 0.9rem;
  line-height: 1.55;
}

.play-area {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 15rem;
  align-items: start;
  gap: clamp(1rem, 3vw, 2rem);
  max-width: 60rem;
  margin: 0 auto;
}

.board {
  --board-size: 5;
  display: grid;
  grid-template-columns: repeat(var(--board-size), minmax(0, 1fr));
  width: min(100%, 38rem);
  aspect-ratio: 1;
  justify-self: center;
  border: 3px solid #3b3831;
  border-radius: 0.45rem;
  overflow: hidden;
  background: #d5cec0;
  box-shadow: 0 0.9rem 2.2rem rgba(58, 50, 39, 0.12);
  user-select: none;
  touch-action: none;
}

.board-cell {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 0;
  padding: 0;
  border: 1px solid rgba(72, 66, 56, 0.26);
  color: #2d2a24;
  cursor: pointer;
  transition:
    filter 120ms ease,
    transform 120ms ease,
    box-shadow 140ms ease;
}

.board-cell:hover:not(:disabled) {
  filter: brightness(0.97);
}

.board-cell:active:not(:disabled) {
  transform: scale(0.97);
}

.board-cell:disabled {
  cursor: default;
}

.board-cell.hint-attention {
  z-index: 1;
  box-shadow: inset 0 0 0 4px rgba(49, 93, 121, 0.5);
}

.board-cell.hint-related {
  z-index: 1;
  box-shadow: inset 0 0 0 4px rgba(181, 128, 31, 0.55);
}

.board-cell.hint-target {
  z-index: 2;
  box-shadow: inset 0 0 0 5px rgba(42, 120, 72, 0.72);
}

.board-cell.region-top {
  border-top: 3px solid #3b3831;
}

.board-cell.region-right {
  border-right: 3px solid #3b3831;
}

.board-cell.region-bottom {
  border-bottom: 3px solid #3b3831;
}

.board-cell.region-left {
  border-left: 3px solid #3b3831;
}

.region-tone-0 {
  background: #f5e9cc;
}

.region-tone-1 {
  background: #e7efe5;
}

.region-tone-2 {
  background: #e8edf4;
}

.region-tone-3 {
  background: #f2e5df;
}

.region-tone-4 {
  background: #eee6f2;
}

.region-tone-5 {
  background: #e4efed;
}

.cell-x {
  font-size: clamp(1.25rem, 5vw, 2.7rem);
  font-weight: 300;
  line-height: 1;
  color: #8d877b;
}

.cell-dog {
  width: 72%;
  height: 72%;
  pointer-events: none;
  filter: drop-shadow(0 0.08rem 0.06rem rgba(58, 42, 28, 0.16));
}

.cell-error {
  animation: cell-error 420ms ease-out;
}

@keyframes cell-error {
  0%,
  100% {
    box-shadow: inset 0 0 0 0 rgba(172, 53, 38, 0);
  }
  35% {
    box-shadow: inset 0 0 0 5px rgba(172, 53, 38, 0.72);
  }
}

.action-panel {
  padding: 1rem;
  border: 1px solid #ded7c8;
  border-radius: 1rem;
  background: rgba(255, 255, 255, 0.76);
}

.action-panel h2 {
  margin: 0 0 0.8rem;
  font-size: 1rem;
}

.action-button {
  width: 100%;
  padding: 0.72rem 0.85rem;
  border: 1px solid #59452f;
  border-radius: 0.7rem;
  background: #59452f;
  color: #fff;
  cursor: pointer;
}

.action-button + .action-button {
  margin-top: 0.5rem;
}

.action-button:disabled {
  border-color: #c5bdae;
  background: #d8d1c5;
  color: #7c7569;
  cursor: default;
}

.action-button-secondary {
  background: transparent;
  color: #59452f;
}

.hint-box {
  min-height: 8.2rem;
  margin-top: 0.85rem;
  padding: 0.75rem;
  border-radius: 0.75rem;
  background: #f6f2e9;
}

.hint-title {
  display: block;
  color: #4e463a;
  font-size: 0.88rem;
}

.hint-text {
  margin: 0.35rem 0 0;
  color: #6d665a;
  font-size: 0.82rem;
  line-height: 1.5;
}

.input-help,
.feedback,
.build-status {
  color: #6d665a;
  font-size: 0.82rem;
  line-height: 1.5;
}

.input-help {
  margin: 1rem 0 0;
}

.feedback {
  min-height: 3.8em;
  margin: 0.8rem 0 0;
  color: #79422f;
}

.build-status {
  margin: 1.25rem 0 0;
  text-align: center;
  opacity: 0.68;
}

.restart-dialog,
.level-dialog,
.settings-dialog,
.clear-dialog {
  max-width: min(32rem, calc(100vw - 2rem));
  padding: 1.25rem;
  border: 0;
  border-radius: 1rem;
  color: #28251f;
  background: #fffdf8;
  box-shadow: 0 1.4rem 4rem rgba(28, 24, 18, 0.28);
}

.restart-dialog::backdrop,
.level-dialog::backdrop,
.settings-dialog::backdrop,
.clear-dialog::backdrop {
  background: rgba(39, 34, 28, 0.45);
}

.restart-dialog h2,
.level-dialog h2,
.settings-dialog h2,
.clear-dialog h2 {
  margin: 0;
  font-size: 1.15rem;
}

.restart-dialog p,
.level-dialog > p,
.settings-dialog > p {
  margin: 0.7rem 0 1.1rem;
  color: #6d665a;
}

.dialog-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}

.dialog-actions .action-button {
  margin: 0;
}

.level-dialog {
  width: min(44rem, calc(100vw - 2rem));
  max-width: min(44rem, calc(100vw - 2rem));
  max-height: min(82vh, 46rem);
  overflow: auto;
}

.level-pagination {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.9rem;
}

.level-page-button {
  min-height: 2.5rem;
  padding: 0.5rem 0.75rem;
  border: 1px solid #a89883;
  border-radius: 0.7rem;
  background: #fffdf8;
  color: #59452f;
  cursor: pointer;
}

.level-page-button:disabled {
  opacity: 0.42;
  cursor: default;
}

.level-range {
  color: #4e463a;
  text-align: center;
  font-size: 0.88rem;
}

.level-list {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.6rem;
  margin-bottom: 1rem;
}

.level-tile {
  display: grid;
  gap: 0.2rem;
  min-height: 5.7rem;
  padding: 0.75rem;
  border: 1px solid #d4c9b8;
  border-radius: 0.8rem;
  background: #fff;
  color: #3f392f;
  text-align: left;
  cursor: pointer;
}

.level-tile[data-state='current'] {
  border-color: #315d79;
  box-shadow: inset 0 0 0 2px rgba(49, 93, 121, 0.24);
}

.level-tile[data-state='cleared'] {
  background: #eef6ee;
}

.level-tile[data-state='locked'] {
  background: #eeeae2;
  color: #8d877b;
  cursor: default;
}

.level-tile span,
.level-tile small {
  font-size: 0.75rem;
}

.settings-list {
  display: grid;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.setting-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 1rem;
  padding: 0.85rem;
  border: 1px solid #ded7c8;
  border-radius: 0.8rem;
  background: #f8f4eb;
  cursor: pointer;
}

.setting-copy {
  display: grid;
  gap: 0.2rem;
}

.setting-copy small {
  color: #6d665a;
  line-height: 1.4;
}

.setting-row input {
  width: 1.25rem;
  height: 1.25rem;
  accent-color: #59452f;
}

.clear-dialog {
  text-align: center;
}

.clear-mascot {
  animation: clear-mascot-in 420ms cubic-bezier(0.2, 0.8, 0.25, 1.2);
}

.clear-mascot .cell-dog {
  width: 5.6rem;
  height: 5.6rem;
}

@keyframes clear-mascot-in {
  from {
    opacity: 0;
    transform: translateY(0.5rem) scale(0.86);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.clear-level {
  margin: 0.45rem 0 0.8rem;
  color: #6d665a;
}

#app[data-reduced-motion='true'] .board-cell {
  transition: none;
}

#app[data-reduced-motion='true'] .cell-error {
  animation: none;
  box-shadow: inset 0 0 0 4px rgba(172, 53, 38, 0.72);
}

#app[data-reduced-motion='true'] .clear-mascot {
  animation: none;
}

@media (max-width: 900px) {
  .level-list {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 760px) {
  .game-shell {
    padding-inline: 0.75rem;
  }

  .header-row {
    grid-template-columns: 5.8rem 1fr 5.8rem;
  }

  .header-button {
    padding-inline: 0.55rem;
    font-size: 0.82rem;
  }

  .game-subtitle {
    font-size: 0.86rem;
  }

  .status-bar {
    margin-block: 1rem;
  }

  .play-area {
    grid-template-columns: 1fr;
  }

  .action-panel {
    width: min(100%, 38rem);
    justify-self: center;
  }

  .input-help,
  .feedback {
    text-align: center;
  }

  .level-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 440px) {
  .header-row {
    grid-template-columns: 1fr 1fr;
  }

  .header-row h1 {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  .header-row .header-button {
    grid-row: 2;
  }

  .header-button-right {
    justify-self: end;
  }

  .status-bar {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .level-list {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  .board-cell {
    transition: none;
  }

  .cell-error {
    animation: none;
    box-shadow: inset 0 0 0 4px rgba(172, 53, 38, 0.72);
  }

  .clear-mascot {
    animation: none;
  }
}


.board {
  grid-template-rows: repeat(var(--board-size), minmax(0, 1fr));
  background: #cbc1af;
}

.board-cell {
  border-color: rgba(72, 66, 56, 0.38);
}

.cell-x {
  color: #6f695e;
  font-weight: 400;
}

/*
 * 9×9を最大盤面とし、Region ID 0〜8へ重複しないcategorical toneを割り当てる。
 * Human Playtestで淡色・近似色の判別が難しいというFeedbackがあったため、
 * Calm + Cuteの雰囲気を維持しつつ色相差を広げる。
 */
.board-cell[data-region='0'] {
  background: #9ecfc8;
}

.board-cell[data-region='1'] {
  background: #e7d685;
}

.board-cell[data-region='2'] {
  background: #beb8d9;
}

.board-cell[data-region='3'] {
  background: #e89a8f;
}

.board-cell[data-region='4'] {
  background: #9ebed7;
}

.board-cell[data-region='5'] {
  background: #e2b476;
}

.board-cell[data-region='6'] {
  background: #b5d083;
}

.board-cell[data-region='7'] {
  background: #e4b3c9;
}

.board-cell[data-region='8'] {
  background: #c6c6bd;
}

.mobile-input-mode {
  display: none;
}

@media (max-width: 760px), (pointer: coarse) {
  body {
    overflow-x: hidden;
  }

  .game-shell {
    padding-left: max(0.75rem, env(safe-area-inset-left));
    padding-right: max(0.75rem, env(safe-area-inset-right));
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
  }

  .play-area {
    grid-template-columns: minmax(0, 1fr);
  }

  .board {
    width: min(100%, 38rem);
    max-width: calc(100vw - 1.5rem);
    -webkit-tap-highlight-color: transparent;
  }

  .mobile-input-mode {
    grid-template-columns: auto minmax(4.5rem, 1fr) minmax(4.5rem, 1fr);
    align-items: center;
    gap: 0.55rem;
    width: min(100%, 38rem);
    justify-self: center;
    padding: 0.65rem;
    border: 1px solid #ded7c8;
    border-radius: 0.9rem;
    background: rgba(255, 255, 255, 0.86);
  }

  .mobile-input-label {
    color: #6d665a;
    font-size: 0.82rem;
    font-weight: 700;
  }

  .mobile-input-button {
    min-height: 3rem;
    padding: 0.55rem 0.8rem;
    border: 1px solid #a89883;
    border-radius: 0.75rem;
    background: #fffdf8;
    color: #59452f;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }

  .mobile-input-button[aria-pressed='true'] {
    border-color: #59452f;
    background: #59452f;
    color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
  }

  .action-button,
  .header-button,
  .level-tile,
  .setting-row {
    min-height: 2.75rem;
  }

  .restart-dialog,
  .level-dialog,
  .settings-dialog,
  .clear-dialog {
    max-height: calc(100dvh - 1.5rem);
    overflow: auto;
  }
}

@media (pointer: coarse) {
  .mobile-input-mode {
    display: grid;
  }
}

@media (max-width: 440px) {
  .game-shell {
    padding-top: max(0.75rem, env(safe-area-inset-top));
  }

  .game-subtitle {
    line-height: 1.45;
  }

  .board {
    max-width: calc(100vw - 1rem);
  }

  .mobile-input-mode {
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    padding: 0.5rem;
  }

  .mobile-input-label {
    grid-column: 1 / -1;
    text-align: center;
  }

  .level-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .level-pagination {
    gap: 0.45rem;
  }

  .level-page-button {
    padding-inline: 0.55rem;
  }

  .action-panel {
    padding: 0.85rem;
  }

  .hint-box {
    min-height: 0;
  }

  .input-help {
    margin-top: 0.75rem;
  }
}

  <body>
    <main id="app" aria-live="polite"></main>
    <script>
      "use strict";
(() => {
  // src/audio/sfx.ts
  var TONES = {
    mark: [{ frequency: 440, duration: 0.045, gain: 0.025 }],
    dog: [
      { frequency: 520, duration: 0.07, gain: 0.035 },
      { frequency: 680, duration: 0.09, delay: 0.035, gain: 0.03 }
    ],
    undo: [{ frequency: 330, duration: 0.07, gain: 0.025, type: "triangle" }],
    mistake: [
      { frequency: 170, duration: 0.1, gain: 0.025, type: "square" },
      { frequency: 135, duration: 0.12, delay: 0.07, gain: 0.02, type: "square" }
    ],
    clear: [
      { frequency: 523.25, duration: 0.12, gain: 0.03 },
      { frequency: 659.25, duration: 0.12, delay: 0.09, gain: 0.03 },
      { frequency: 783.99, duration: 0.18, delay: 0.18, gain: 0.035 }
    ]
  };
  function createSfxPlayer(isEnabled) {
    let context = null;
    function getContext() {
      if (context) {
        return context;
      }
      try {
        context = new AudioContext();
        return context;
      } catch {
        return null;
      }
    }
    function play(name) {
      if (!isEnabled()) {
        return;
      }
      const audioContext = getContext();
      if (!audioContext) {
        return;
      }
      if (audioContext.state === "suspended") {
        void audioContext.resume().catch(() => void 0);
      }
      const start = audioContext.currentTime;
      for (const tone of TONES[name]) {
        const toneStart = start + (tone.delay ?? 0);
        const toneEnd = toneStart + tone.duration;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = tone.type ?? "sine";
        oscillator.frequency.setValueAtTime(tone.frequency, toneStart);
        gain.gain.setValueAtTime(tone.gain ?? 0.03, toneStart);
        gain.gain.exponentialRampToValueAtTime(1e-4, toneEnd);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(toneStart);
        oscillator.stop(toneEnd);
      }
    }
    return { play };
  }

  // src/game/actions.ts
  var toggleExcluded = (cell) => ({ type: "TOGGLE_EXCLUDED", cell });
  var placeDog = (cell) => ({ type: "PLACE_DOG", cell });
  var removeDog = (cell) => ({ type: "REMOVE_DOG", cell });
  var bulkSetExcluded = (cells) => ({
    type: "BULK_SET_EXCLUDED",
    cells
  });
  var bulkClearExcluded = (cells) => ({
    type: "BULK_CLEAR_EXCLUDED",
    cells
  });
  var undo = () => ({ type: "UNDO" });
  var restart = () => ({ type: "RESTART" });

  // src/puzzle/types.ts
  function cellToIndex(size, cell) {
    return cell.row * size + cell.col;
  }
  function indexToCell(size, index) {
    return {
      row: Math.floor(index / size),
      col: index % size
    };
  }
  function getRegionId(puzzle2, cell) {
    return puzzle2.regions[cellToIndex(puzzle2.size, cell)];
  }

  // src/puzzle/rules.ts
  function isCellInBounds(size, cell) {
    return Number.isInteger(cell.row) && Number.isInteger(cell.col) && cell.row >= 0 && cell.row < size && cell.col >= 0 && cell.col < size;
  }
  function areCellsAdjacent(a, b) {
    if (a.row === b.row && a.col === b.col) {
      return false;
    }
    return Math.abs(a.row - b.row) <= 1 && Math.abs(a.col - b.col) <= 1;
  }
  function isPlacementAllowed(puzzle2, placements, candidate) {
    if (!isCellInBounds(puzzle2.size, candidate)) {
      return false;
    }
    if (placements.length !== puzzle2.size || placements[candidate.row] !== null) {
      return false;
    }
    const candidateRegion = getRegionId(puzzle2, candidate);
    if (candidateRegion === void 0) {
      return false;
    }
    for (let row = 0; row < placements.length; row += 1) {
      const col = placements[row];
      if (col === null) {
        continue;
      }
      const placed = { row, col };
      if (col === candidate.col) {
        return false;
      }
      if (getRegionId(puzzle2, placed) === candidateRegion) {
        return false;
      }
      if (areCellsAdjacent(placed, candidate)) {
        return false;
      }
    }
    return true;
  }
  function isCompleteSolutionValid(puzzle2, solution) {
    if (solution.length !== puzzle2.size) {
      return false;
    }

      },
      onRightClick(cell) {
        dispatch(placeDog(cell));
      },
      onDrag(cells, mode) {
        dispatch(mode === "mark" ? bulkSetExcluded(cells) : bulkClearExcluded(cells));
      }
    });
    view.hintButton.addEventListener("click", showNextHint);
    view.undoButton.addEventListener("click", () => dispatch(undo()));
    view.levelsButton.addEventListener("click", openLevelSelect);
    view.settingsButton.addEventListener("click", openSettings);
    view.levelPreviousButton.addEventListener("click", () => {
      levelSelectPageIndex = clampLevelPageIndex(levelSelectPageIndex - 1, RUNTIME_LEVELS.length);
      renderLevelSelectPage();
    });
    view.levelNextButton.addEventListener("click", () => {
      levelSelectPageIndex = clampLevelPageIndex(levelSelectPageIndex + 1, RUNTIME_LEVELS.length);
      renderLevelSelectPage();
    });
    view.levelCloseButton.addEventListener("click", closeLevelSelect);
    view.levelDialog.addEventListener("cancel", (event) => {
      event.preventDefault();
      closeLevelSelect();
    });
    view.settingsSoundInput.addEventListener("change", () => {
      updateSettings({
        ...saveData.settings,
        soundEffects: view.settingsSoundInput.checked
      });
    });
    view.settingsReducedMotionInput.addEventListener("change", () => {
      updateSettings({
        ...saveData.settings,
        reducedMotion: view.settingsReducedMotionInput.checked ? "reduced" : "system"
      });
    });
    view.settingsCloseButton.addEventListener("click", closeSettings);
    view.settingsDialog.addEventListener("cancel", (event) => {
      event.preventDefault();
      closeSettings();
    });
    view.restartButton.addEventListener("click", () => {
      view.restartDialog.showModal();
    });
    view.restartCancelButton.addEventListener("click", () => {
      view.restartDialog.close();
    });
    view.restartConfirmButton.addEventListener("click", () => {
      view.restartDialog.close();
      dispatch(restart());
    });
    view.restartDialog.addEventListener("cancel", (event) => {
      event.preventDefault();
      view.restartDialog.close();
    });
    view.clearDialog.addEventListener("cancel", (event) => {
      event.preventDefault();
    });
    view.clearNextButton.addEventListener("click", () => {
      view.clearDialog.close();
      if (currentLevel < RUNTIME_LEVELS.length) {
        loadLevel(currentLevel + 1, false);
      }
    });
    view.clearLevelsButton.addEventListener("click", () => {
      view.clearDialog.close();
      openLevelSelect();
    });
  }
  function mountView() {
    view = createGameView(root, puzzle, getBuildStatus(), currentLevel);
    applyMotionPreference();
    syncSettingsView();
    bindCurrentView();
    renderCurrent();
  }
  function loadLevel(levelNumber, restoreSavedSession) {
    if (clearTransitionTimer !== null) {
      window.clearTimeout(clearTransitionTimer);
      clearTransitionTimer = null;
    }
    currentLevel = clampRuntimeLevel(levelNumber);
    runtimeLevel = requireRuntimeLevel(currentLevel);
    puzzle = runtimeLevel.puzzle;
    hintState = createIdleHintState();
    session = restoreSavedSession ? restoreStartupSession(puzzle, currentLevel, saveData) : createGameSession(puzzle);
    saveData = {
      ...saveData,
      currentLevel,
      latestUnlockedLevel: Math.max(saveData.latestUnlockedLevel, currentLevel)
    };
    mountView();
    persistCurrentSession();
  }
  mountView();
  motionMediaQuery.addEventListener("change", () => {
    if (saveData.settings.reducedMotion === "system") {
      applyMotionPreference();
    }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && !session.completed) {
      persistCurrentSession();
    }
  });
  document.addEventListener("keydown", (event) => {
    const target = event.target;
    const editable = target?.isContentEditable || target?.tagName === "INPUT" || target?.tagName === "TEXTAREA" || target?.tagName === "SELECT";
    const dialogOpen = view.restartDialog.open || view.levelDialog.open || view.settingsDialog.open || view.clearDialog.open;
    if (!editable && !dialogOpen && (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
      event.preventDefault();
      dispatch(undo());
      return;
    }
    if (!editable && !dialogOpen && event.key.toLowerCase() === "h" && !session.completed) {
      event.preventDefault();
      showNextHint();
    }
  });
})();

    </script>
  </body>
</html>
