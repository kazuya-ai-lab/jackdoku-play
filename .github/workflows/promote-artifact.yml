name: Promote Accepted Artifact

on:
  push:
    branches:
      - feat/promote-1000-level-bank
    paths:
      - .github/workflows/promote-artifact.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download and verify accepted artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-515c-822f-9611-3a886ca7a363/raw?se=2026-09-16T08%3A42%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=f5ece85b-30bf-5d12-8fae-44ad00437cfe&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T00%3A34%3A46Z&ske=2026-09-17T00%3A34%3A46Z&sks=b&skv=2026-02-06&sig=ljMDGc%2BVEfer3NmpI1iGpjJJoWplUsTfPQz5hG3MhYM%3D'
          EXPECTED_SHA256: '1fab0b5e9351302c0c689c01e98dcfc77d8eb7dabf935d69b5f2ca3d065c6545'
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output artifact.payload

          if unzip -t artifact.payload >/dev/null 2>&1; then
            unzip -p artifact.payload Jackdoku.html > candidate.html
          else
            cp artifact.payload candidate.html
          fi

          actual="$(sha256sum candidate.html | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_SHA256"
          grep -qi '<!doctype html>' candidate.html
          cp candidate.html index.html
          echo "Verified accepted artifact SHA-256: $actual"

      - name: Commit promoted artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html is already current.'
            exit 0
          fi
          git commit -m 'feat(distribution): 1,000レベル版Artifactを昇格' -m 'Private mainのPlaytest Package Run #9で検証済みのArtifactをSHA-256照合後、そのままindex.htmlとして反映する。'
          git push origin HEAD:feat/promote-1000-level-bank
