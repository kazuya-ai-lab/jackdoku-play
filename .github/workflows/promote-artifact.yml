name: Promote Accepted Artifact

on:
  push:
    branches:
      - feat/promote-3000-tap-input
    paths:
      - .github/workflows/promote-artifact.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download and verify accepted artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-829c-8206-8cab-3463e181a842/raw?se=2026-09-27T05%3A52%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=7be174e2-87c4-5c5b-a3be-d544619c4a33&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T01%3A21%3A10Z&ske=2026-09-28T01%3A21%3A10Z&sks=b&skv=2026-02-06&sig=R9f1N0yMHstHSL2ZcGAJUdYbXoptarlIE1FJsdFA2Vo%3D'
          EXPECTED_SHA256: '758f43db33705f604181fb6a2979b349570a70d560088459f71f7e7d532d9c86'
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output artifact.payload

          if unzip -t artifact.payload >/dev/null 2>&1; then
            unzip -p artifact.payload Jackdoku.html > candidate.html
          else
            cp artifact.payload candidate.html
          fi

          actual="$(sha256sum candidate.html | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_SHA256"
          grep -qi '<!doctype html>' candidate.html
          cp candidate.html index.html
          echo "Verified accepted artifact SHA-256: $actual"

      - name: Commit promoted artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html is already current.'
            exit 0
          fi
          git commit -m 'feat(distribution): 3,000レベル版Artifactを昇格' -m 'Private mainのPlaytest Packageで検証済みのArtifactをSHA-256照合後、そのままindex.htmlとして反映する。'
          git push origin HEAD:feat/promote-3000-tap-input
