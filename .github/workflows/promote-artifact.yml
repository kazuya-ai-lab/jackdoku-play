name: Promote Accepted Artifact

on:
  push:
    branches:
      - feat/promote-2000-level-bank
    paths:
      - .github/workflows/promote-artifact.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download and verify accepted artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-b900-81fd-bb78-2eb303621c15/raw?se=2026-09-18T13%3A27%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=5e943f3e-ad84-5729-a172-e2a031c5df1d&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A08%3A47Z&ske=2026-09-18T18%3A08%3A47Z&sks=b&skv=2026-02-06&sig=dEHc3ykByn/RGr1GmjtCuBuE8Af9Z9I0VCACSUAIdQg%3D'
          EXPECTED_SHA256: '05cf2961c1acec681ee1cadeb2b0dde8f16648cb9897fb97d43a4e8bb5e7f778'
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output artifact.payload

          if unzip -t artifact.payload >/dev/null 2>&1; then
            unzip -p artifact.payload Jackdoku.html > candidate.html
          else
            cp artifact.payload candidate.html
          fi

          actual="$(sha256sum candidate.html | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_SHA256"
          grep -qi '<!doctype html>' candidate.html
          cp candidate.html index.html
          echo "Verified accepted artifact SHA-256: $actual"

      - name: Commit promoted artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html is already current.'
            exit 0
          fi
          git commit -m 'feat(distribution): 2,000レベル版Artifactを昇格' -m 'Private mainのPlaytest Package Run #12で検証済みのArtifactをSHA-256照合後、そのままindex.htmlとして反映する。'
          git push origin HEAD:feat/promote-2000-level-bank
