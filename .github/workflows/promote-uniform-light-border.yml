name: Promote Uniform Light Borders Artifact (temporary)

on:
  push:
    branches:
      - fix/distribution-light-uniform-two-pixel-borders

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Fetch and verify accepted Private build
        shell: bash
        env:
          ARTIFACT_DOWNLOAD_URL: "https://sdmntprwestus2.oaiusercontent.com/files/00000000-4b78-81f8-985d-a12f69a909ad/raw?se=2026-10-12T09%3A42%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=417ecbc4-19df-578f-8878-89c300df3b59&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A13%3A40Z&ske=2026-10-13T01%3A13%3A40Z&sks=b&skv=2026-02-06&sig=soLclVuXQacRY0DD5tiWw/DW86dWPbpVUNx%2BNiouUU8%3D"
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --output index.html "$ARTIFACT_DOWNLOAD_URL"
          test "$(wc -c < index.html)" -eq 3103771
          printf '%s  %s\n' 'a73a661ee0ea72b463ef98a492a2d65707c4c1fdd38e98bc177316330db5a9e9' 'index.html' | sha256sum --check
          test "$(git hash-object index.html)" = '22a8e903ea15bb838321b79d6d14316af93ee0d4'

      - name: Commit promoted HTML and delete this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md PROVENANCE.md
          git rm .github/workflows/promote-uniform-light-border.yml
          git commit -m "fix(distribution): ライト盤面の内外枠2px統一版を公開候補へ反映"
          git push
