name: Promote Verified Compact Artifact (temporary)

on:
  push:
    branches:
      - fix/distribution-dark-palette-compact-layout

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Fetch validated Private build
        shell: bash
        env:
          ARTIFACT_DOWNLOAD_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-1668-8207-92d6-7dba4e5a5321/raw?se=2026-10-12T04%3A26%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=db403244-cb34-58ca-a3a6-a16098be8d3a&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A46%3A26Z&ske=2026-10-13T01%3A46%3A26Z&sks=b&skv=2026-02-06&sig=NFtmvW%2BhRHgRLSz5t0U7hvamiAo7Llt1nZkZxEOgJNg%3D"
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --output index.html "$ARTIFACT_DOWNLOAD_URL"
          test "$(wc -c < index.html)" -eq 3102684
          printf '%s  %s\n' '3c8948d31b2716e583c840b8c3f393a996059f09255695ebb9300e0507e0a206' 'index.html' | sha256sum --check
          test "$(git hash-object index.html)" = '70264b0543ad5aae5c22b4aaa6312aa4028b1829'

      - name: Save release candidate and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md PROVENANCE.md
          git rm .github/workflows/promote-verified-compact-artifact.yml
          git commit -m "fix(distribution): ダーク配色と1画面UIの検証済みHTMLを反映"
          git push
