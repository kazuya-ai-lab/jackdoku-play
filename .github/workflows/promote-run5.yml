name: Promote Playtest Run 5

on:
  push:
    branches:
      - chore/promote-playtest-run5
    paths:
      - .github/workflows/promote-run5.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/promote-playtest-run5

      - name: Download and verify accepted artifact
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-ced8-8206-9e10-962f8b60da0b/raw?se=2026-09-15T23%3A19%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=0ac9b64a-dcca-54ae-9268-c990913b25fc&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T23%3A13%3A56Z&ske=2026-09-16T23%3A13%3A56Z&sks=b&skv=2026-02-06&sig=KWVZjwOKhniu/kNDoBTjo93Ik%2BjPMnW%2B3bgQ/9sHzAM%3D'
          EXPECTED_SHA256: b6364659a359812496a90c17a953a00a2820470dec554fb45bf021b67c63a9f9
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output index.html
          echo "$EXPECTED_SHA256  index.html" | sha256sum --check --strict

      - name: Update provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('PROVENANCE.md')
          text = path.read_text()
          replacements = {
              '- Source `main` commit: `d12277802ee3dbc6ab85c9600c1a36f1c569f385`': '- Source `main` commit: `e2fbc2e5dbd96f6ad941d2919318dcfdd6b6f4ae`',
              '- Source change: `feat(mobile): Touch操作とスマホ表示に対応 (#15)`': '- Source change: `fix(board): 犬配置時のセル伸長を防止 (#18)`',
              '- Playtest Package run: `#4`': '- Playtest Package run: `#5`',
              '- Artifact SHA-256: `5ebcd9b118a3fbe70a65115c03f056cc4e7dded31beb799f24ae61477ef06d3a`': '- Artifact SHA-256: `b6364659a359812496a90c17a953a00a2820470dec554fb45bf021b67c63a9f9`',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing provenance marker: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit promoted distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html PROVENANCE.md
          git commit -m "feat(distribution): Playtest Run #5を昇格" -m "Private mainの検証済みArtifactをSHA-256照合後、そのままindex.htmlとして反映する。"
          git push origin chore/promote-playtest-run5
