name: Promote Verified Scroll Lock Artifact (temporary)

on:
  push:
    branches:
      - fix/distribution-scroll-lock-dark-contrast

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Fetch and verify accepted Private build
        shell: bash
        env:
          ARTIFACT_DOWNLOAD_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-2240-8206-940c-fd4ee9264659/raw?se=2026-10-12T05%3A26%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=de45e7a5-b963-57a1-b52b-cf5f850e6174&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A29%3A19Z&ske=2026-10-13T01%3A29%3A19Z&sks=b&skv=2026-02-06&sig=qjDiiiIO3H4r4qiPbWrz9fR1xQaEL70CIuu8VPSRwPU%3D"
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --output index.html "$ARTIFACT_DOWNLOAD_URL"
          test "$(wc -c < index.html)" -eq 3103172
          printf '%s  %s\n' '556a5166675091ef9ac2f41a427e6fdb253c68eb6a5b3519de220c692617720b' 'index.html' | sha256sum --check
          test "$(git hash-object index.html)" = '2fe899f3303d1e484b7c7c344085589a24f753a9'

      - name: Commit release candidate, remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md PROVENANCE.md
          git rm .github/workflows/promote-verified-scroll-lock.yml
          git commit -m "fix(distribution): スクロール抑止とダーク盤面の改善版を反映"
          git push
